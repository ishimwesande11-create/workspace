<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background:
                radial-gradient(circle at 20% 20%, #1e40af, transparent 30%),
                radial-gradient(circle at 80% 80%, #7c3aed, transparent 30%),
                linear-gradient(135deg, #020617, #0f172a);
        }

        /* Animated background shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.5;
            animation: float 6s ease-in-out infinite;
        }

        .shape1 {
            width: 180px;
            height: 180px;
            background: #2563eb;
            top: 10%;
            left: 10%;
        }

        .shape2 {
            width: 220px;
            height: 220px;
            background: #9333ea;
            bottom: 5%;
            right: 10%;
            animation-delay: 2s;
        }

        .shape3 {
            width: 100px;
            height: 100px;
            background: #06b6d4;
            top: 60%;
            left: 20%;
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-30px) rotate(180deg);
            }
        }

        /* Login container */
        .login-container {
            width: 400px;
            max-width: 90%;
            position: relative;
            z-index: 5;

            perspective: 1000px;
        }

        .login-card {
            padding: 45px 40px;
            border-radius: 25px;

            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);

            transform-style: preserve-3d;
            transition: transform 0.2s ease;
        }

        /* Logo */
        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 20px;

            background: linear-gradient(135deg, #2563eb, #9333ea);

            color: white;
            font-size: 30px;
            font-weight: bold;

            box-shadow:
                0 15px 30px rgba(37, 99, 235, 0.4);

            transform: translateZ(40px);
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 30px;
            margin-bottom: 8px;
            transform: translateZ(35px);
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 30px;
            transform: translateZ(25px);
        }

        /* Input groups */
        .input-group {
            margin-bottom: 20px;
            transform: translateZ(25px);
        }

        label {
            display: block;
            color: #e2e8f0;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        input {
            width: 100%;
            padding: 15px 45px 15px 16px;

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;

            outline: none;

            background: rgba(15, 23, 42, 0.65);
            color: white;

            font-size: 15px;

            transition: 0.3s;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            border-color: #60a5fa;

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.15),
                0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* Password button */
        .show-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
        }

        .show-password:hover {
            color: white;
        }

        /* Options */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin: 5px 0 25px;

            color: #cbd5e1;
            font-size: 13px;

            transform: translateZ(20px);
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .remember input {
            width: auto;
        }

        .forgot {
            color: #60a5fa;
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* Login button */
        .login-btn {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            color: white;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 12px 25px rgba(37, 99, 235, 0.35);

            transition: 0.3s;

            transform: translateZ(35px);
        }

        .login-btn:hover {
            transform: translateZ(35px) translateY(-3px);

            box-shadow:
                0 18px 35px rgba(124, 58, 237, 0.4);
        }

        .login-btn:active {
            transform: translateZ(35px) translateY(1px);
        }

        /* Message */
        #message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            min-height: 20px;
        }

        /* Register */
        .register {
            text-align: center;
            color: #cbd5e1;
            font-size: 14px;
            margin-top: 25px;

            transform: translateZ(20px);
        }

        .register a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: bold;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* Mobile */
        @media (max-width: 500px) {
            .login-card {
                padding: 35px 25px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>

    <!-- Login -->
    <div class="login-container">

        <div class="login-card" id="loginCard">

            <div class="logo">
                B
            </div>

            <h1>Business Login</h1>

            <p class="subtitle">
                Sign in to access your business dashboard
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Business Email</label>

                    <div class="input-box">
                        <input
                            type="email"
                            id="email"
                            placeholder="you@company.com"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="input-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                        >
                            👁
                        </button>

                    </div>
                </div>

                <div class="options">

                    <label class="remember">
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>

                    <a href="#" class="forgot">
                        Forgot password?
                    </a>

                </div>

                <button type="submit" class="login-btn">
                    Sign In
                </button>

                <div id="message"></div>

            </form>

            <div class="register">
                Don't have an account?
                <a href="#">Create Account</a>
            </div>

        </div>

    </div>


    <script>

        // Password show/hide
        const password = document.getElementById("password");
        const showPassword = document.getElementById("showPassword");

        showPassword.addEventListener("click", function () {

            if (password.type === "password") {
                password.type = "text";
                showPassword.textContent = "🙈";
            } else {
                password.type = "password";
                showPassword.textContent = "👁";
            }

        });


        // Login validation
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;

            if (email === "" || pass === "") {

                message.style.color = "#f87171";
                message.textContent = "Please fill in all fields.";

                return;
            }

            // Demo login
            if (
                email === "admin@business.com" &&
                pass === "123456"
            ) {

                message.style.color = "#4ade80";
                message.textContent = "Login successful!";

                setTimeout(function () {
                    alert("Welcome to your Business Dashboard!");
                }, 500);

            } else {

                message.style.color = "#f87171";
                message.textContent =
                    "Invalid email or password.";

            }

        });


        // 3D mouse movement
        const card = document.getElementById("loginCard");

        document.addEventListener("mousemove", function (event) {

            const x = (window.innerWidth / 2 - event.clientX) / 30;
            const y = (window.innerHeight / 2 - event.clientY) / 30;

            card.style.transform =
                `rotateY(${x}deg) rotateX(${y}deg)`;

        });


        // Reset 3D effect when mouse leaves
        document.addEventListener("mouseleave", function () {

            card.style.transform =
                "rotateY(0deg) rotateX(0deg)";

        });

    </script>

</body>
</html>
